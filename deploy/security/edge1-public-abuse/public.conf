server {
    listen 89.126.248.191:80 default_server;
    server_name edge1.ww.cx ntp.ww.cx;
    server_tokens off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/edge1-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    root /var/lib/edge1-public-redirect-empty;
    access_log /var/log/nginx/edge1-public-abuse.log edge1_public_abuse if=$edge1_public_rejected;
    add_header Referrer-Policy no-referrer always;
    add_header Retry-After $edge1_public_retry_after always;
    location / {
        limit_req zone=edge1_public_visits burst=20 nodelay;
        limit_req zone=edge1_public_probes burst=5 nodelay;
        limit_req_status 429;
        try_files /__edge1_redirect_only_missing__ @edge1_public_redirect;
    }
    location @edge1_public_redirect {
        return 302 https://www.ww.cx/;
    }
}
server {
    listen 89.126.248.191:443 ssl default_server;
    server_name edge1.ww.cx;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/edge1.ww.cx/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/edge1.ww.cx/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /var/lib/edge1-public-redirect-empty;
    access_log /var/log/nginx/edge1-public-abuse.log edge1_public_abuse if=$edge1_public_rejected;
    add_header Referrer-Policy no-referrer always;
    add_header Retry-After $edge1_public_retry_after always;
    location / {
        limit_req zone=edge1_public_visits burst=20 nodelay;
        limit_req zone=edge1_public_probes burst=5 nodelay;
        limit_req_status 429;
        try_files /__edge1_redirect_only_missing__ @edge1_public_redirect;
    }
    location @edge1_public_redirect {
        return 302 https://www.ww.cx/;
    }
}
