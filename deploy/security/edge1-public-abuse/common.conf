# Shared source-address buckets across public HTTP and HTTPS. Forwarded headers ignored.
geo $edge1_public_trusted {
    default 0;
    127.0.0.0/8 1;
    ::1 1;
    10.77.0.0/24 1;
    89.126.248.191/32 1;
}
map $edge1_public_trusted $edge1_public_rate_key {
    0 $binary_remote_addr;
    1 "";
}
map $uri $edge1_public_probe {
    default 0;
    ~*^/(admin|login|wp-admin|wp-login|xmlrpc|phpmyadmin|\.env|\.git|edge1-ops|api|actuator|cgi-bin)(/|[.]|$) 1;
}
map $edge1_public_probe $edge1_public_probe_key {
    0 "";
    1 $edge1_public_rate_key;
}
limit_req_zone $edge1_public_rate_key zone=edge1_public_visits:10m rate=2r/s;
limit_req_zone $edge1_public_probe_key zone=edge1_public_probes:10m rate=6r/m;
map $limit_req_status $edge1_public_rejected {
    default 0;
    REJECTED 1;
}
map $status $edge1_public_retry_after {
    default "";
    429 60;
}
# No request URL, query, cookie, user-agent or other client-controlled fields.
log_format edge1_public_abuse '$remote_addr $status $limit_req_status $edge1_public_probe [$time_local]';
