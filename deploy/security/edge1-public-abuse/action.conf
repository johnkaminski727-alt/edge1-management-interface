# Fail closed on command error; never fall back to a whole-host ban.
[INCLUDES]
before = ufw.conf
[Definition]
actionban = ufw prepend reject proto tcp from <ip> to 89.126.248.191 port 80,443 comment "Edge1 public web abuse"
actionunban = ufw delete reject proto tcp from <ip> to 89.126.248.191 port 80,443
