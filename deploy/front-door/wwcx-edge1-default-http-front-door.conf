# WW.CX Edge1 raw/default HTTP front door.
# Include only inside the default.invalid *:80 virtual host.
# Redirect only the ordinary document root; all named/operational paths remain untouched.
RewriteEngine On
RewriteCond %{REQUEST_URI} ^/(?:index\.html)?$ [NC]
RewriteRule ^/?(?:index\.html)?$ https://ww.cx/time/ [R=302,L,NE]
