    # Authenticated, bounded AVA owner-delegation endpoint. Only registered workflows are accepted.
    location = /edge1-ops/ava-dispatch/api/workflows {
        set $edge1_return_to /edge1-ops/status/ava/;
        auth_request /_edge1_status_session_check;
        error_page 401 = @edge1_status_login;
        proxy_pass http://127.0.0.1:8801/api/workflows;
        proxy_http_version 1.1;
        proxy_set_header Host edge1.ww.cx;
        proxy_set_header Origin https://edge1.ww.cx;
        proxy_set_header X-Edge1-Request-ID $request_id;
        proxy_set_header X-Edge1-Client-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_buffering off;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
