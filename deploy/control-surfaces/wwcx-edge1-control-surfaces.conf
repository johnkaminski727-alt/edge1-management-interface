# WW.CX Edge1 Control Surfaces public/private boundary.
#
# Ordinary edge1.ww.cx root requests are public-safe and leave Edge1.
# Explicit application/API proxy routes in the parent vhost remain untouched.
#
# FreePBX Administration and UCP remain available only through approved
# loopback/private management networks.

# Remove the Debian default document from the ordinary Edge1 public surface.
RewriteCond %{HTTP_HOST} ^edge1\.ww\.cx$ [NC]
RewriteCond %{REQUEST_URI} ^/(?:index\.html)?$ [NC]
RewriteRule ^/?(?:index\.html)?$ https://creekco.ca/time/ [R=302,L,NE]

# Native FreePBX control surfaces are private-control.
<LocationMatch "^/(?:admin|ucp)(?:/|$)">
    <RequireAny>
        Require ip 127.0.0.1
        Require ip ::1
        Require ip 10.77.0.0/24
        Require ip 100.64.0.0/10
        Require ip fd7a:115c:a1e0::/48
    </RequireAny>
</LocationMatch>
