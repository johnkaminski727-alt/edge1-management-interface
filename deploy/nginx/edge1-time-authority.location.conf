# WW.CX Time Authority — authenticated read-only API.
# Install inside the private edge1.ww.cx server block. Static dashboard assets
# are published under /var/www/edge1-status/time-authority and served through
# the already-authenticated /edge1-ops/status/ tree.
location ^~ /api/time-authority/ {
    add_header Set-Cookie $edge1_doom_cookie always;
    set $edge1_return_to /edge1-ops/status/time-authority/;
    auth_request /_edge1_status_session_check;
    error_page 401 = @edge1_status_login;

    proxy_pass http://127.0.0.1:8101;
    proxy_http_version 1.1;
    proxy_set_header Host edge1.ww.cx;
    proxy_set_header X-Edge1-Client-IP $remote_addr;
    proxy_set_header X-Edge1-Original-Path $request_uri;
    proxy_set_header X-Edge1-Request-ID $request_id;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Real-IP "";
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
}
