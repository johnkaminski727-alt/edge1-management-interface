    # Unified Private Library Sources admin/status API. Browser access is authenticated
    # by the existing Edge1 session; backend remains loopback-only.
    location ^~ /edge1-ops/library-sources/api/ {
        set $edge1_return_to /edge1-ops/status/library-sources/;
        auth_request /_edge1_status_session_check;
        error_page 401 = @edge1_status_login;
        proxy_pass http://127.0.0.1:8800/api/;
        proxy_http_version 1.1;
        proxy_set_header Host edge1.ww.cx;
        proxy_set_header X-Edge1-Request-ID $request_id;
        proxy_set_header X-Edge1-Client-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_buffering off;
        client_max_body_size 12k;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
