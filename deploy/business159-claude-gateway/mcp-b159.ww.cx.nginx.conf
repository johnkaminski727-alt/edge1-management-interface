# Business159 Claude connector gateway — public front for 127.0.0.1:8150.
# Installed by install-business159-claude-gateway.sh, which replaces
# __EDGE1_PUBLIC_IP__ with the address edge1.ww.cx resolves to (the same
# address the existing sites bind to; no wildcard listener is added).
#
# Only the OAuth and MCP paths are proxied; everything else is 404.
# /mcp and /token are limited to Anthropic's published outbound range
# (https://platform.claude.com/docs/en/api/ip-addresses). /authorize is opened
# by the operator's own browser and is protected by the TOTP step.

limit_req_zone $binary_remote_addr zone=b159_claude_gateway:10m rate=10r/s;

server {
    listen __EDGE1_PUBLIC_IP__:80;
    server_name mcp-b159.ww.cx;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/b159-claude-acme;
        default_type text/plain;
    }
    location / {
        return 301 https://mcp-b159.ww.cx$request_uri;
    }
}

# BEGIN-TLS
server {
    listen __EDGE1_PUBLIC_IP__:443 ssl;
    server_name mcp-b159.ww.cx;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/mcp-b159.ww.cx/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mcp-b159.ww.cx/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;

    client_max_body_size 1m;
    limit_req zone=b159_claude_gateway burst=40 nodelay;
    limit_req_status 429;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Connection "";
    proxy_read_timeout 200s;
    proxy_buffering off;

    location = /mcp {
        allow 160.79.104.0/21;
        deny all;
        proxy_pass http://127.0.0.1:8150;
    }
    location = /token {
        allow 160.79.104.0/21;
        deny all;
        proxy_pass http://127.0.0.1:8150;
    }
    location = /authorize {
        proxy_pass http://127.0.0.1:8150;
    }
    location ~ ^/\.well-known/oauth-(authorization-server|protected-resource(/mcp)?)$ {
        proxy_pass http://127.0.0.1:8150;
    }
    location / {
        return 404;
    }
}
# END-TLS
