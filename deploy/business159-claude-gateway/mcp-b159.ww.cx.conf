# Business159 Claude connector gateway — public front for 127.0.0.1:8150.
# Only the OAuth and MCP paths are proxied; everything else is 404.
# /mcp and /token are limited to Anthropic's published outbound range
# (https://platform.claude.com/docs/en/api/ip-addresses). /authorize is opened
# by the operator's own browser and is protected by the TOTP step.

<VirtualHost *:80>
    ServerName mcp-b159.ww.cx
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://mcp-b159.ww.cx%{REQUEST_URI} [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName mcp-b159.ww.cx

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/mcp-b159.ww.cx/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/mcp-b159.ww.cx/privkey.pem

    Header always set Strict-Transport-Security "max-age=31536000"
    Header always set X-Content-Type-Options "nosniff"
    ServerSignature Off

    ProxyRequests Off
    ProxyPreserveHost On
    ProxyTimeout 200
    RequestHeader unset X-Forwarded-For early

    ProxyPassMatch "^/(mcp|token|authorize|healthz|\.well-known/oauth-(?:authorization-server|protected-resource(?:/mcp)?))$" "http://127.0.0.1:8150/$1" retry=0
    ProxyPassReverse / http://127.0.0.1:8150/

    <LocationMatch "^/(mcp|token)$">
        Require ip 160.79.104.0/21
    </LocationMatch>

    <Location "/healthz">
        Require local
    </Location>

    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/(mcp|token|authorize|healthz|\.well-known/oauth-(authorization-server|protected-resource(/mcp)?))$
    RewriteRule ^ - [R=404,L]
</VirtualHost>
