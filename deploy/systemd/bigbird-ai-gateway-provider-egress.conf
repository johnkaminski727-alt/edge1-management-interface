# Enable outbound provider access for the Ava gateway.
#
# The base unit intentionally denies all non-loopback IP traffic. When an
# external model provider is configured, this drop-in clears only that
# systemd IP filter. The gateway process itself remains bound to
# 127.0.0.1:8787 and all other unit hardening stays in force.
[Service]
IPAddressDeny=
IPAddressAllow=
