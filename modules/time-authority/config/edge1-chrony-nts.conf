# WW.CX Edge1 Network Time Security (NTS) server fragment
# Canonical authenticated endpoint: ntp.ww.cx
#
# Certificate and key files are staged by the guarded NTS installer. This
# fragment must not be enabled until those files have been validated.

ntsport 4460
ntsservercert /etc/chrony/nts/ntp.ww.cx-fullchain.pem
ntsserverkey /etc/chrony/nts/ntp.ww.cx-privkey.pem
ntsdumpdir /var/lib/chrony
