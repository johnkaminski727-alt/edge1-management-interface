# WW.CX Edge1 public NTP service
#
# Production target: ntp.ww.cx
# Daemon: chronyd on Debian 12
#
# This configuration intentionally does NOT use the `local` directive. If
# upstream synchronization is lost, chronyd must not pretend that an
# unsynchronized local clock is authoritative.

# Diverse upstream references already observed by the WW.CX Time Authority.
server sth1.ntp.se iburst
server sth2.ntp.se iburst
server mmo1.ntp.se iburst
server time.nist.gov iburst
server time.cloudflare.com iburst

# Require multiple selectable sources before disciplining/serving time.
minsources 3

# Normal host-clock discipline.
driftfile /var/lib/chrony/chrony.drift
makestep 1.0 3
rtcsync
leapsectz right/UTC

# Public NTP service. Firewall publication and DNS are separate deployment
# gates and are not performed by this file.
port 123
allow 0/0
allow ::/0

# Bound response rate per client address to reduce abuse from broken or
# malicious clients while allowing ordinary startup bursts.
ratelimit interval 1 burst 8 leak 2
clientloglimit 1048576

# Do not expose chronyc's UDP command/monitoring port. Local privileged
# administration continues through chronyd's Unix-domain command socket.
cmdport 0

# Optional reviewed service fragments such as the NTS server configuration.
# The NTS installer creates this directory before enabling its fragment.
confdir /etc/chrony/conf.d

# Operational logging.
log tracking measurements statistics
logdir /var/log/chrony
