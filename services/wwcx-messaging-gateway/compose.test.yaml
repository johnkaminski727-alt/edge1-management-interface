services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: wwcx_messaging
      POSTGRES_USER: wwcx
      POSTGRES_PASSWORD: wwcx-test-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wwcx -d wwcx_messaging"]
      interval: 3s
      timeout: 3s
      retries: 20
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - ./migrations:/docker-entrypoint-initdb.d:ro

  gateway:
    build:
      context: .
      dockerfile: Containerfile
    environment:
      DATABASE_URL: postgresql://wwcx:wwcx-test-only@postgres:5432/wwcx_messaging
      WWCX_SIMULATOR_TOKEN: test-token
      WWCX_SIMULATOR_OUTBOUND_ENABLED: "true"
      WWCX_MANAGEMENT_READ_TOKEN: test-read-token
      WWCX_MANAGEMENT_CONTROL_TOKEN: test-control-token
      WWCX_MANAGEMENT_CONTROL_ENABLED: "false"
      WWCX_OUTBOUND_WORKER_ENABLED: "true"
      WWCX_OUTBOUND_PROVIDER_ALLOWLIST: simulator
      WWCX_OUTBOUND_POLICY_ENABLED: "true"
      WWCX_OUTBOUND_AUTHORIZED_SENDERS: "+16045550101"
      WWCX_OUTBOUND_DESTINATION_PREFIX_ALLOWLIST: "+1"
      WWCX_OUTBOUND_MAX_RECIPIENTS: "1"
      WWCX_OUTBOUND_MAX_TEXT_CHARS: "1600"
      WWCX_OUTBOUND_HOURLY_MESSAGE_LIMIT: "10"
      WWCX_OUTBOUND_DAILY_MESSAGE_LIMIT: "25"
      WWCX_OUTBOUND_RETRY_DELAY_SECONDS: "1"
      WWCX_OUTBOUND_MAX_ATTEMPTS: "3"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:58080:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/readyz')"]
      interval: 3s
      timeout: 3s
      retries: 20
