# DESIGN-ONLY CANDIDATE — DO NOT INSTALL WITHOUT THE APPROVED RUNBOOK
#
# Clear the vendor ListenStream list, preserve both Unix sockets, and retain
# TCP only on IPv4 and IPv6 loopback. This file requires a controlled
# mariadb.socket/mariadb.service restart and verified rollback.

[Socket]
ListenStream=
ListenStream=@mariadb
ListenStream=/run/mysqld/mysqld.sock
ListenStream=127.0.0.1:3306
ListenStream=[::1]:3306
