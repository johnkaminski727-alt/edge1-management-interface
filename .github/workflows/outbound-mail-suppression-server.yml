name: Validate outbound mail suppression server

on:
  pull_request:
    paths:
      - 'server/outbound_mail_gateway_server.py'
      - 'server/outbound_mail_gateway_suppressed_server.py'
      - 'server/outbound_mail_suppression_gate.py'
      - 'server/outbound_mail_delivery_events.py'
      - 'tests/validate_outbound_mail_suppression_server.py'
      - 'docs/messaging-operations/outbound-mail-suppression-server-integration-20260804.md'
      - '.github/workflows/outbound-mail-suppression-server.yml'
  push:
    branches:
      - main
    paths:
      - 'server/outbound_mail_gateway_server.py'
      - 'server/outbound_mail_gateway_suppressed_server.py'
      - 'server/outbound_mail_suppression_gate.py'
      - 'server/outbound_mail_delivery_events.py'
      - 'tests/validate_outbound_mail_suppression_server.py'
      - 'docs/messaging-operations/outbound-mail-suppression-server-integration-20260804.md'
      - '.github/workflows/outbound-mail-suppression-server.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax checks
        run: |
          python3 -m py_compile server/outbound_mail_gateway_suppressed_server.py
          python3 -m py_compile tests/validate_outbound_mail_suppression_server.py
      - name: Functional validation
        run: python3 tests/validate_outbound_mail_suppression_server.py
