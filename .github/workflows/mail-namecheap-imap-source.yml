name: Mail Namecheap IMAP Source

on:
  push:
    paths:
      - 'server/mail_namecheap_imap_source.py'
      - 'server/mail_local_rfc822_source.py'
      - 'server/mail_correspondence_store.py'
      - 'tests/test_mail_namecheap_imap_source.py'
      - '.github/workflows/mail-namecheap-imap-source.yml'
  pull_request:
    paths:
      - 'server/mail_namecheap_imap_source.py'
      - 'server/mail_local_rfc822_source.py'
      - 'server/mail_correspondence_store.py'
      - 'tests/test_mail_namecheap_imap_source.py'
      - '.github/workflows/mail-namecheap-imap-source.yml'

permissions:
  contents: read

jobs:
  provider-source-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Compile provider source
        run: python -m py_compile server/mail_namecheap_imap_source.py server/mail_local_rfc822_source.py server/mail_correspondence_store.py
      - name: Run provider source tests
        run: pytest -q tests/test_mail_namecheap_imap_source.py
