name: Patch MariaDB UCP readiness gate

on:
  push:
    branches:
      - agent/fix-mariadb-ucp-readiness-20260801

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-mariadb-ucp-readiness-20260801
          fetch-depth: 0

      - name: Patch operator and add regression coverage
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          operator_path = Path("tools/security/apply_mariadb_loopback_socket_hardening.sh")
          text = operator_path.read_text(encoding="utf-8")

          marker = "EXPECTED_SOURCE_SHA=c5365e2d9bd882fcf62a8676b98f8f996094c5b5e45572fe9a0244b7f4f32fea\nROLLBACK_ARMED=0\n"
          replacement = "EXPECTED_SOURCE_SHA=c5365e2d9bd882fcf62a8676b98f8f996094c5b5e45572fe9a0244b7f4f32fea\nPOST_CHANGE_ATTEMPTS=60\nROLLBACK_ARMED=0\n"
          if marker not in text:
              raise SystemExit("operator constant insertion point not found")
          text = text.replace(marker, replacement, 1)

          old_rollback = '''    restart_mariadb_pair || return 1
    systemctl show mariadb.socket mariadb.service \\
        >"$EVIDENCE_DIR/systemd-after-rollback.txt" 2>&1 || true
    ss -H -ltnpe >"$EVIDENCE_DIR/tcp-listeners-after-rollback.txt" 2>&1 || true
    ss -H -lxnp >"$EVIDENCE_DIR/unix-listeners-after-rollback.txt" 2>&1 || true
'''
          new_rollback = '''    restart_mariadb_pair || return 1
    wait_for_ucp_runtime "$EVIDENCE_DIR/tcp-listeners-after-rollback.txt" || return 1
    systemctl show mariadb.socket mariadb.service \\
        >"$EVIDENCE_DIR/systemd-after-rollback.txt" 2>&1 || true
    ss -H -lxnp >"$EVIDENCE_DIR/unix-listeners-after-rollback.txt" 2>&1 || true
    ss -Htnpe state established \\
        >"$EVIDENCE_DIR/mariadb-connections-after-rollback.txt" 2>&1 || true
'''
          if old_rollback not in text:
              raise SystemExit("rollback readiness insertion point not found")
          text = text.replace(old_rollback, new_rollback, 1)

          function_marker = '''ucp_loopback_connection_reestablished() {
    ss -Htnpe state established 2>/dev/null |
        awk '
        function loopback(endpoint) {
            return endpoint ~ /^127\\./ || endpoint ~ /^\\[::1\\]:/ || endpoint ~ /::ffff:127\\./;
        }
        $3 ~ /:3306$/ || $4 ~ /:3306$/ {
            found++;
            if (!loopback($3) || !loopback($4)) bad++;
            if ($4 ~ /:3306$/ && loopback($3) && loopback($4) && $0 ~ /users:\\(\\(\\"node/) ucp_client++;
        }
        END { exit !(found > 0 && bad == 0 && ucp_client > 0); }
        '
}
'''
          function_replacement = function_marker + '''
wait_for_ucp_runtime() {
    tcp_output=$1
    attempt=1
    while [ "$attempt" -le "$POST_CHANGE_ATTEMPTS" ]; do
        ss -H -ltnpe >"$tcp_output" 2>&1 || return 1
        if ucp_contract_ok "$tcp_output" && ucp_loopback_connection_reestablished; then
            return 0
        fi
        sleep 1
        attempt=$((attempt + 1))
    done
    return 1
}

wait_for_post_change_runtime() {
    attempt=1
    while [ "$attempt" -le "$POST_CHANGE_ATTEMPTS" ]; do
        ss -H -ltnpe >"$EVIDENCE_DIR/tcp-listeners-after.txt" 2>&1 || return 1
        ss -H -lxnp >"$EVIDENCE_DIR/unix-listeners-after.txt" 2>&1 || return 1
        if listener_contract_ok "$EVIDENCE_DIR/tcp-listeners-after.txt" && \\
           unix_contract_ok "$EVIDENCE_DIR/unix-listeners-after.txt" && \\
           ucp_contract_ok "$EVIDENCE_DIR/tcp-listeners-after.txt" && \\
           ucp_loopback_connection_reestablished; then
            printf '%s\\n' "$attempt" >"$EVIDENCE_DIR/post-change-readiness-attempts.txt"
            return 0
        fi
        sleep 1
        attempt=$((attempt + 1))
    done
    printf '%s\\n' "$POST_CHANGE_ATTEMPTS" >"$EVIDENCE_DIR/post-change-readiness-attempts.txt"
    return 1
}
'''
          if function_marker not in text:
              raise SystemExit("UCP connection function insertion point not found")
          text = text.replace(function_marker, function_replacement, 1)

          old_main = '''systemctl show mariadb.socket mariadb.service >"$EVIDENCE_DIR/systemd-after.txt" 2>&1 || fail_after_mutation "could not capture post-change systemd state"
ss -H -ltnpe >"$EVIDENCE_DIR/tcp-listeners-after.txt" 2>&1 || fail_after_mutation "could not capture TCP listeners"
ss -H -lxnp >"$EVIDENCE_DIR/unix-listeners-after.txt" 2>&1 || fail_after_mutation "could not capture Unix listeners"

listener_contract_ok "$EVIDENCE_DIR/tcp-listeners-after.txt" || fail_after_mutation "TCP 3306 does not match IPv4/IPv6 loopback-only contract"
unix_contract_ok "$EVIDENCE_DIR/unix-listeners-after.txt" || fail_after_mutation "required MariaDB Unix sockets are missing"
ucp_contract_ok "$EVIDENCE_DIR/tcp-listeners-after.txt" || fail_after_mutation "UCP listeners changed unexpectedly"

log "Waiting for the local FreePBX/UCP database relationship to re-establish"
reconnected=0
attempt=1
while [ "$attempt" -le 30 ]; do
    if ucp_loopback_connection_reestablished; then
        reconnected=1
        break
    fi
    sleep 1
    attempt=$((attempt + 1))
done
[ "$reconnected" -eq 1 ] || fail_after_mutation "the local UCP Node MariaDB TCP relationship did not re-establish within 30 seconds"
'''
          new_main = '''systemctl show mariadb.socket mariadb.service >"$EVIDENCE_DIR/systemd-after.txt" 2>&1 || fail_after_mutation "could not capture post-change systemd state"

log "Waiting up to $POST_CHANGE_ATTEMPTS seconds for MariaDB and FreePBX/UCP readiness"
if ! wait_for_post_change_runtime; then
    listener_contract_ok "$EVIDENCE_DIR/tcp-listeners-after.txt" || fail_after_mutation "TCP 3306 does not match IPv4/IPv6 loopback-only contract"
    unix_contract_ok "$EVIDENCE_DIR/unix-listeners-after.txt" || fail_after_mutation "required MariaDB Unix sockets are missing"
    ucp_contract_ok "$EVIDENCE_DIR/tcp-listeners-after.txt" || fail_after_mutation "UCP listeners did not recover within the readiness window"
    ucp_loopback_connection_reestablished || fail_after_mutation "the local UCP Node MariaDB TCP relationship did not recover within the readiness window"
    fail_after_mutation "post-change MariaDB/UCP readiness timed out"
fi
log "Post-change MariaDB and UCP readiness gate passed"
'''
          if old_main not in text:
              raise SystemExit("instantaneous UCP check block not found")
          text = text.replace(old_main, new_main, 1)
          operator_path.write_text(text, encoding="utf-8")

          test_path = Path("tests/validate_mariadb_loopback_ucp_readiness.py")
          test_path.write_text('''#!/usr/bin/env python3
"""Validate bounded UCP readiness handling in the MariaDB activation operator."""

from pathlib import Path

ROOT = Path(__file__).resolve().parents[1]
SCRIPT = ROOT / "tools/security/apply_mariadb_loopback_socket_hardening.sh"
text = SCRIPT.read_text(encoding="utf-8")

required = (
    "POST_CHANGE_ATTEMPTS=60",
    "wait_for_ucp_runtime() {",
    "wait_for_post_change_runtime() {",
    "Waiting up to $POST_CHANGE_ATTEMPTS seconds for MariaDB and FreePBX/UCP readiness",
    "post-change-readiness-attempts.txt",
    "UCP listeners did not recover within the readiness window",
    "Post-change MariaDB and UCP readiness gate passed",
    'wait_for_ucp_runtime "$EVIDENCE_DIR/tcp-listeners-after-rollback.txt" || return 1',
)
for token in required:
    if token not in text:
        raise SystemExit(f"missing bounded UCP readiness behavior: {token}")

main_start = text.index('log "Restarting MariaDB socket and service as one bounded maintenance action"')
main_end = text.index("ss -Htnpe state established 2>/dev/null |", main_start)
main = text[main_start:main_end]
if main.index("wait_for_post_change_runtime") > main.index("UCP listeners did not recover"):
    raise SystemExit("UCP failure may be evaluated before the readiness wait")
if "while [ \"$attempt\" -le 30 ]" in main:
    raise SystemExit("obsolete relationship-only 30-second wait remains")

rollback_start = text.index("rollback() {")
rollback_end = text.index("\nfail_after_mutation() {", rollback_start)
rollback = text[rollback_start:rollback_end]
if rollback.index("restart_mariadb_pair") > rollback.index("wait_for_ucp_runtime"):
    raise SystemExit("rollback UCP wait must follow MariaDB restoration")

print("MariaDB loopback UCP readiness contract: PASS")
''', encoding="utf-8")

          doc_path = Path("docs/security/mariadb-loopback-ucp-readiness-incident-20260801.md")
          doc_path.write_text('''# MariaDB Loopback Hardening UCP Readiness Incident — 2026-08-01

## Scope

This record covers the corrected-rollback activation attempt at `2026-08-01T06:45:08+00:00`. It does not claim that loopback-only MariaDB hardening was activated.

## Evidence

- Host: `edge1.ww.cx`
- Evidence directory: `/var/lib/wwcx-deployment-evidence/mariadb-loopback-hardening/20260801T064508Z`
- Operator console SHA-256: `d3836d37df213fe8bce76521c8e80c99954a0f42a2ae3bc9ee43c930bed2cc89`
- Operator result: `CHANGE FAILED AND ROLLED BACK`

## Verified behavior

The corrected rollback logic restored the prior absent-drop-in state, restarted `mariadb.socket` and `mariadb.service`, and returned both units active. The original wildcard TCP 3306 listener and both Unix sockets were restored. Asterisk remained at zero active channels and calls.

## Root cause

The activation path captured TCP listeners immediately after restarting MariaDB and failed if UCP ports 8001 and 8003 were not already present. FreePBX UCP Node restarts asynchronously after its database connection is interrupted, so an immediate listener assertion can fail during a normal recovery interval.

The operator already waited for the UCP-to-MariaDB relationship, but that wait occurred only after the instantaneous UCP listener assertion. The intended readiness wait was therefore unreachable when UCP needed startup time.

## Correction

The operator now uses a bounded 60-second post-change readiness gate. Each attempt requires all of the following simultaneously:

- MariaDB TCP listeners match IPv4 and IPv6 loopback-only policy;
- both MariaDB Unix sockets are present;
- UCP listeners 8001 and 8003 are present;
- the UCP Node to MariaDB relationship is established and fully loopback scoped.

Rollback also waits for UCP listeners and its loopback database relationship after restoring and restarting the prior MariaDB contract. Failure of dependent runtime recovery remains fail-closed, but MariaDB restoration is attempted first.

## Current decision

The baseline was restored and the loopback-only drop-in is absent. No further live activation attempt is permitted until this readiness correction is merged, pulled to Edge1, and both hosted validation workflows pass.
''', encoding="utf-8")
          PY

          sh -n tools/security/apply_mariadb_loopback_socket_hardening.sh
          python3 tests/validate_apply_mariadb_loopback_socket_hardening.py
          python3 tests/validate_mariadb_loopback_operator_recovery.py
          python3 tests/validate_mariadb_loopback_ucp_readiness.py

      - name: Commit patched operator
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "John K."
          git config user.email "johnkaminski727@gmail.com"
          rm -f .github/workflows/patch-mariadb-ucp-readiness.yml
          git add tools/security/apply_mariadb_loopback_socket_hardening.sh \
            tests/validate_mariadb_loopback_ucp_readiness.py \
            docs/security/mariadb-loopback-ucp-readiness-incident-20260801.md \
            .github/workflows/patch-mariadb-ucp-readiness.yml
          git commit -m "Wait for FreePBX UCP readiness during MariaDB hardening"
          git push origin HEAD:agent/fix-mariadb-ucp-readiness-20260801
