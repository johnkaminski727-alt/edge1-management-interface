name: Ava Office Manager

on:
  pull_request:
    paths:
      - 'server/ava_office_manager.py'
      - 'server/ava_office_manager_server.py'
      - 'server/ava_call_archive.py'
      - 'server/ava_call_archive_writer.py'
      - 'server/ava_appointment_workflow.py'
      - 'server/ava_attendant_session.py'
      - 'server/office_portability_bridge_summary.py'
      - 'config/ava-office-manager-policy.json'
      - 'schemas/ava/call-record.schema.json'
      - 'deploy/systemd/wwcx-ava-office.service'
      - 'deploy/ava-office/**'
      - 'src/web/ava-office/**'
      - 'tests/test_ava_office_manager.py'
      - 'tests/test_ava_assistant_workflows.py'
      - 'tests/test_ava_office_manager_server.py'
      - 'tests/test_ava_call_archive.py'
      - 'tests/test_ava_call_archive_writer.py'
      - 'tests/test_ava_portability_commissioning.py'
      - 'tests/test_office_portability_bridge_summary.py'
      - 'docs/ava/office-manager-architecture.md'
      - 'docs/ava/call-archive-read-adapter.md'
      - 'docs/ava/call-archive-write-contract.md'
      - '.github/workflows/ava-office-manager.yml'
  push:
    branches:
      - main
    paths:
      - 'server/ava_office_manager.py'
      - 'server/ava_office_manager_server.py'
      - 'server/ava_call_archive.py'
      - 'server/ava_call_archive_writer.py'
      - 'server/ava_appointment_workflow.py'
      - 'server/ava_attendant_session.py'
      - 'server/office_portability_bridge_summary.py'
      - 'config/ava-office-manager-policy.json'
      - 'schemas/ava/call-record.schema.json'
      - 'deploy/systemd/wwcx-ava-office.service'
      - 'deploy/ava-office/**'
      - 'src/web/ava-office/**'
      - 'tests/test_ava_office_manager.py'
      - 'tests/test_ava_assistant_workflows.py'
      - 'tests/test_ava_office_manager_server.py'
      - 'tests/test_ava_call_archive.py'
      - 'tests/test_ava_call_archive_writer.py'
      - 'tests/test_ava_portability_commissioning.py'
      - 'tests/test_office_portability_bridge_summary.py'
      - 'docs/ava/office-manager-architecture.md'
      - 'docs/ava/call-archive-read-adapter.md'
      - 'docs/ava/call-archive-write-contract.md'
      - '.github/workflows/ava-office-manager.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile foundation
        run: |
          python -m py_compile \
            server/ava_office_manager.py \
            server/ava_office_manager_server.py \
            server/ava_call_archive.py \
            server/ava_call_archive_writer.py \
            server/ava_appointment_workflow.py \
            server/ava_attendant_session.py \
            server/office_portability_bridge_summary.py \
            tests/test_ava_office_manager.py \
            tests/test_ava_assistant_workflows.py \
            tests/test_ava_office_manager_server.py \
            tests/test_ava_call_archive.py \
            tests/test_ava_call_archive_writer.py \
            tests/test_ava_portability_commissioning.py \
            tests/test_office_portability_bridge_summary.py
      - name: Validate JSON contracts
        run: |
          python -m json.tool config/ava-office-manager-policy.json >/dev/null
          python -m json.tool schemas/ava/call-record.schema.json >/dev/null
      - name: Validate commissioning shell
        run: |
          sh -n deploy/ava-office/commission-read-only.sh
          sh deploy/ava-office/commission-read-only.sh --dry-run
      - name: Validate browser JavaScript
        run: node --check src/web/ava-office/app.js
      - name: Run office manager tests
        run: python -m unittest -v tests.test_ava_office_manager tests.test_ava_assistant_workflows tests.test_ava_office_manager_server tests.test_ava_call_archive tests.test_ava_call_archive_writer tests.test_ava_portability_commissioning tests.test_office_portability_bridge_summary
