name: Apply outbound mail preparation API

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/outbound-mail-preparation-api'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply function-scoped preparation API patch
        run: python3 tools/apply_outbound_mail_preparation_api_patch.py

      - name: Validate preparation API foundation
        run: |
          python3 -m json.tool config/messaging/outbound-mail-gateway.json >/dev/null
          python3 -m unittest \
            tests.test_outbound_mail_policy \
            tests.test_outbound_mail_gateway \
            tests.test_outbound_mail_admin_assets \
            tests.test_mail_identity_registry \
            tests.test_identity_aware_outbound_gateway \
            tests.test_outbound_mail_preparation_auth
          python3 tests/validate_outbound_mail_gateway.py
          python3 -m compileall -q server tests tools

      - name: Commit final changes and remove one-shot helpers
        run: |
          rm .github/workflows/apply-outbound-mail-preparation-api.yml
          rm tools/apply_outbound_mail_preparation_api_patch.py
          git config user.name "WW.CX Engineering Agent"
          git config user.email "johnkaminski727@gmail.com"
          git add -A
          git commit -m "Add authenticated outbound preparation API"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
