name: Validate Private AI browser worker

on:
  pull_request:
    paths:
      - 'server/private_ai_browser_worker.py'
      - 'tests/test_private_ai_browser_worker.py'
      - 'deploy/private-ai-browser-worker.service'
      - 'docs/private-ai-browser-interface.md'
      - '.github/workflows/private-ai-browser-worker-validation.yml'
  push:
    branches: [main]
    paths:
      - 'server/private_ai_browser_worker.py'
      - 'tests/test_private_ai_browser_worker.py'
      - 'deploy/private-ai-browser-worker.service'
      - 'docs/private-ai-browser-interface.md'
      - '.github/workflows/private-ai-browser-worker-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile worker
        run: python -m py_compile server/private_ai_browser_worker.py
      - name: Run worker tests
        run: python -m unittest tests.test_private_ai_browser_worker
      - name: Enforce private gateway boundary
        run: |
          grep -F 'http://127.0.0.1:8787/v1/chat' server/private_ai_browser_worker.py
          ! grep -E '0\.0\.0\.0:8787|https?://[^"[:space:]]+:8787' server/private_ai_browser_worker.py | grep -v '127.0.0.1:8787'
