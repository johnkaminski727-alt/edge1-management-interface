name: Validate Private AI browser worker

on:
  pull_request:
    paths:
      - 'server/private_ai_browser_worker.py'
      - 'server/ava_agent_controller.py'
      - 'server/ava_contacts_gateway.py'
      - 'server/phone_intelligence_gateway.py'
      - 'services/bigbird-ai-gateway/app/**'
      - 'server/ava_visual_generator.py'
      - 'server/ava_visual_worker.py'
      - 'tests/test_private_ai_browser_worker.py'
      - 'tests/test_ava_agent_controller.py'
      - 'tests/test_ava_contacts_gateway.py'
      - 'tests/test_ava_readonly_gateway.py'
      - 'tests/test_bigbird_private_library_engine.py'
      - 'tests/test_ava_phase3o_commissioning.py'
      - 'tests/test_ava_visual_generator.py'
      - 'deploy/private-ai-browser-worker.service'
      - 'deploy/install-ava-browser-worker.sh'
      - 'deploy/install-ava-readonly-gateway.sh'
      - 'deploy/install-bigbird-private-library-runtime.sh'
      - 'deploy/systemd/bigbird-ai-gateway.service'
      - 'deploy/systemd/bigbird-ai-gateway-provider-egress.conf'
      - 'tools/ava_gateway_signed_acceptance.py'
      - 'tools/private_library/bootstrap_library_runtime.py'
      - 'deploy/ava-visual-worker.service'
      - 'deploy/ava-visual/**'
      - 'docs/private-ai-browser-interface.md'
      - 'docs/ava-imagination-visuals.md'
      - '.github/workflows/private-ai-browser-worker-validation.yml'
  push:
    branches: [main]
    paths:
      - 'server/private_ai_browser_worker.py'
      - 'server/ava_agent_controller.py'
      - 'server/ava_contacts_gateway.py'
      - 'server/phone_intelligence_gateway.py'
      - 'services/bigbird-ai-gateway/app/**'
      - 'server/ava_visual_generator.py'
      - 'server/ava_visual_worker.py'
      - 'tests/test_private_ai_browser_worker.py'
      - 'tests/test_ava_agent_controller.py'
      - 'tests/test_ava_contacts_gateway.py'
      - 'tests/test_ava_readonly_gateway.py'
      - 'tests/test_bigbird_private_library_engine.py'
      - 'tests/test_ava_phase3o_commissioning.py'
      - 'tests/test_ava_visual_generator.py'
      - 'deploy/private-ai-browser-worker.service'
      - 'deploy/install-ava-browser-worker.sh'
      - 'deploy/install-ava-readonly-gateway.sh'
      - 'deploy/install-bigbird-private-library-runtime.sh'
      - 'deploy/systemd/bigbird-ai-gateway.service'
      - 'deploy/systemd/bigbird-ai-gateway-provider-egress.conf'
      - 'tools/ava_gateway_signed_acceptance.py'
      - 'tools/private_library/bootstrap_library_runtime.py'
      - 'deploy/ava-visual-worker.service'
      - 'deploy/ava-visual/**'
      - 'docs/private-ai-browser-interface.md'
      - 'docs/ava-imagination-visuals.md'
      - '.github/workflows/private-ai-browser-worker-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Ava runtime and workers
        run: |
          python -m py_compile \
            server/private_ai_browser_worker.py \
            server/ava_agent_controller.py \
            server/ava_contacts_gateway.py \
            server/phone_intelligence_gateway.py \
            services/bigbird-ai-gateway/app/library_engine.py \
            services/bigbird-ai-gateway/app/main.py \
            tools/ava_gateway_signed_acceptance.py \
            tools/private_library/bootstrap_library_runtime.py \
            server/ava_visual_generator.py \
            server/ava_visual_worker.py
      - name: Run Ava runtime tests
        run: |
          python -m unittest \
            tests.test_private_ai_browser_worker \
            tests.test_ava_agent_controller \
            tests.test_ava_contacts_gateway \
            tests.test_ava_readonly_gateway \
            tests.test_bigbird_private_library_engine \
            tests.test_ava_phase3o_commissioning \
            tests.test_ava_visual_generator
      - name: Verify immutable Ava commissioning assets
        run: |
          sh -n deploy/install-ava-readonly-gateway.sh
          sh -n deploy/install-ava-browser-worker.sh
          sh -n deploy/install-bigbird-private-library-runtime.sh
          systemd-analyze verify deploy/systemd/bigbird-ai-gateway.service deploy/private-ai-browser-worker.service
          grep -F 'WorkingDirectory=/opt/bigbird-ai-gateway/current' deploy/systemd/bigbird-ai-gateway.service
          grep -F 'ExecStart=/usr/bin/python3 /opt/bigbird-ai-gateway/current/app/main.py' deploy/systemd/bigbird-ai-gateway.service
          grep -F 'WorkingDirectory=/opt/wwcx-private-ai-browser-worker/current' deploy/private-ai-browser-worker.service
          grep -F 'ExecStart=/usr/bin/python3 /opt/wwcx-private-ai-browser-worker/current/private_ai_browser_worker.py' deploy/private-ai-browser-worker.service
          grep -F 'no reusable WW.CX queue worker identity is present' deploy/install-ava-browser-worker.sh
          ! grep -E 'git[[:space:]]+(checkout|reset|pull|clean)' deploy/install-ava-readonly-gateway.sh deploy/install-ava-browser-worker.sh deploy/install-bigbird-private-library-runtime.sh
      - name: Verify Ava visual systemd unit
        run: systemd-analyze verify deploy/ava-visual-worker.service
      - name: Validate immutable visual activation helper
        run: |
          sh -n deploy/ava-visual/activate.sh
          sh deploy/ava-visual/activate.sh --dry-run --repo "$PWD" --ref HEAD
          grep -F 'WorkingDirectory=/opt/wwcx/ava-visual/current' deploy/ava-visual-worker.service
          grep -F 'ExecStart=/usr/bin/python3 /opt/wwcx/ava-visual/current/ava_visual_worker.py' deploy/ava-visual-worker.service
          ! grep -E 'git[[:space:]]+(checkout|reset|pull|clean)' deploy/ava-visual/activate.sh
      - name: Enforce private gateway and credential boundaries
        run: |
          grep -F 'http://127.0.0.1:8787/v1/chat' server/private_ai_browser_worker.py
          ! grep -E '0\.0\.0\.0:8787|https?://[^"[:space:]]+:8787' server/private_ai_browser_worker.py | grep -v '127.0.0.1:8787'
          grep -F 'OPENAI_API_KEY' server/ava_visual_generator.py server/ava_visual_worker.py
          grep -F 'EnvironmentFile=-/etc/bigbird-ai-gateway.env' deploy/ava-visual-worker.service
          ! grep -R -E 'sk-[A-Za-z0-9_-]{20,}' server/ava_visual_generator.py server/ava_visual_worker.py deploy/ava-visual-worker.service deploy/ava-visual/activate.sh
