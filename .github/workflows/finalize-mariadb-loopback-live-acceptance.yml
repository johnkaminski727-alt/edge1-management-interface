name: Finalize MariaDB loopback live acceptance

on:
  push:
    branches:
      - agent/mariadb-loopback-live-acceptance-20260801

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/mariadb-loopback-live-acceptance-20260801
          fetch-depth: 0

      - name: Apply warning cleanup and acceptance record
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          operator = Path("tools/security/apply_mariadb_loopback_socket_hardening.sh")
          text = operator.read_text(encoding="utf-8")
          old = r'$0 ~ /users:\(\(\"node/'
          new = r'$0 ~ /users:\(\("node/'
          if old not in text:
              raise SystemExit("expected awk UCP regex not found")
          operator.write_text(text.replace(old, new, 1), encoding="utf-8")

          validator = Path("tests/validate_mariadb_loopback_ucp_readiness.py")
          validation = validator.read_text(encoding="utf-8")
          marker = '\nprint("MariaDB loopback UCP readiness contract: PASS")\n'
          addition = '''\nif '\\\"node' in text:\n    raise SystemExit("awk UCP regex contains an unnecessary escaped quote")\n'''
          if marker not in validation:
              raise SystemExit("validator insertion point not found")
          validator.write_text(validation.replace(marker, addition + marker, 1), encoding="utf-8")

          Path("docs/security/mariadb-loopback-live-acceptance-20260801.md").write_text(
              '''# MariaDB Loopback Hardening Live Acceptance — 2026-08-01

## Result

The approved loopback-only MariaDB socket contract was applied successfully on `edge1.ww.cx` at `2026-08-01T07:09:57+00:00`.

## Evidence

- Evidence directory: `/var/lib/wwcx-deployment-evidence/mariadb-loopback-hardening/20260801T070803Z`
- Operator console SHA-256: `2ed603b22e79fd4610af5aafac2d60906e5b149188c6b7dac5f6327a7231d25f`
- Installed drop-in SHA-256: `c5365e2d9bd882fcf62a8676b98f8f996094c5b5e45572fe9a0244b7f4f32fea`
- Readiness completed on attempt: `4` of `60`
- Operator result: `CHANGE APPLIED AND VERIFIED`

## Accepted runtime state

- `mariadb.socket` and `mariadb.service` were active and running.
- TCP 3306 listened only on `127.0.0.1` and `::1`.
- The abstract `@mariadb` socket and `/run/mysqld/mysqld.sock` remained present.
- FreePBX UCP listeners 8001 and 8003 recovered.
- One UCP Node client relationship and the matching MariaDB server relationship were established entirely over IPv4 loopback.
- Asterisk reported zero active channels and zero active calls.
- The installed drop-in metadata was `0644 root:root` and its hash matched the approved source.

## Non-impact statement

No call was originated. No emergency calling, live carrier routing, firewall, WireGuard, database schema, grant, package, CAP feed, or external traffic change was performed by this activation.

## Warning cleanup

The successful run emitted a GNU `awk` warning because the UCP client regular expression unnecessarily escaped a double quote. The match and acceptance result were correct. The operator source was subsequently corrected to remove that warning, with a regression assertion preventing its return.
''',
              encoding="utf-8",
          )
          PY

          sh -n tools/security/apply_mariadb_loopback_socket_hardening.sh
          python3 tests/validate_apply_mariadb_loopback_socket_hardening.py
          python3 tests/validate_mariadb_loopback_operator_recovery.py
          python3 tests/validate_mariadb_loopback_ucp_readiness.py
          printf '%s\n' '0 0 127.0.0.1:59282 127.0.0.1:3306 users:(("node"))' |
            awk '$0 ~ /users:\(\("node/ { found=1 } END { exit !found }'

      - name: Commit durable closeout
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "John K."
          git config user.email "johnkaminski727@gmail.com"
          rm -f .github/workflows/finalize-mariadb-loopback-live-acceptance.yml
          git add tools/security/apply_mariadb_loopback_socket_hardening.sh \
            tests/validate_mariadb_loopback_ucp_readiness.py \
            docs/security/mariadb-loopback-live-acceptance-20260801.md \
            .github/workflows/finalize-mariadb-loopback-live-acceptance.yml
          git commit -m "Record MariaDB loopback live acceptance"
          git push origin HEAD:agent/mariadb-loopback-live-acceptance-20260801
