name: Apply identity-aware preparation patch

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/identity-aware-prepare-cli'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply identity-aware preparation changes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          def replace_once(path_text: str, old: str, new: str, label: str) -> None:
              path = Path(path_text)
              text = path.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit(f'{label}: expected one exact anchor, found {text.count(old)}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'server/outbound_mail_gateway.py',
              '''def runtime_policy(base_policy: dict[str, Any], request: dict[str, Any]) -> dict[str, Any]:
              candidate = copy.deepcopy(base_policy)
              if request.get("mailing_address"):
                  candidate["organization"]["mailing_address"] = request["mailing_address"]
              outbound_mail_policy.validate_policy(candidate)
              return candidate
          ''',
              '''def runtime_policy(base_policy: dict[str, Any], request: dict[str, Any]) -> dict[str, Any]:
              candidate = copy.deepcopy(base_policy)
              requested_from = str(request.get("from_address", "")).strip()
              if requested_from:
                  candidate["organization"]["contact_email"] = (
                      outbound_mail_policy.validate_from_address(candidate, requested_from)
                  )
              if request.get("mailing_address"):
                  candidate["organization"]["mailing_address"] = request["mailing_address"]
              outbound_mail_policy.validate_policy(candidate)
              return candidate
          ''',
              'gateway runtime policy sender alignment',
          )

          cli = Path('tools/outbound_mail_prepare.py')
          cli_text = cli.read_text(encoding='utf-8')
          cli_text = cli_text.replace(
              'import outbound_mail_gateway  # noqa: E402\nimport outbound_mail_policy  # noqa: E402\n',
              'import identity_aware_outbound_gateway  # noqa: E402\nimport mail_identity_registry  # noqa: E402\nimport outbound_mail_gateway  # noqa: E402\nimport outbound_mail_policy  # noqa: E402\n',
              1,
          )
          cli_text = cli_text.replace(
              'DEFAULT_CONFIG = REPO_ROOT / "config" / "messaging" / "outbound-mail-gateway.json"\n',
              'DEFAULT_CONFIG = REPO_ROOT / "config" / "messaging" / "outbound-mail-gateway.json"\nDEFAULT_IDENTITIES = REPO_ROOT / "config" / "messaging" / "mail-identities.json"\n',
              1,
          )
          cli_text = cli_text.replace(
              '    "from_address": "john@ww.cx",\n',
              '    "identity_hint": "john-wwcx",\n',
              1,
          )
          policy_arg = '''    parser.add_argument(
                  "--policy",
                  default="",
                  help="Policy JSON path. Defaults to the path declared by the gateway config.",
              )
          '''
          identity_arg = policy_arg + '''    parser.add_argument(
                  "--identities",
                  default=str(DEFAULT_IDENTITIES),
                  help="Canonical mail-identity registry JSON path.",
              )
          '''
          if cli_text.count(policy_arg) != 1:
              raise SystemExit('CLI policy argument anchor was not unique')
          cli_text = cli_text.replace(policy_arg, identity_arg, 1)

          old_prepare = '''def prepare_artifact(
              config: dict[str, Any],
              policy: dict[str, Any],
              request: dict[str, Any],
          ) -> tuple[dict[str, Any], dict[str, Any]]:
              requested_from = str(
                  request.get("from_address") or policy["organization"]["contact_email"]
              )
              validated_from = outbound_mail_policy.validate_from_address(policy, requested_from)
              effective_policy = copy.deepcopy(policy)
              effective_policy["organization"]["contact_email"] = validated_from
              outbound_mail_policy.validate_policy(effective_policy)

              preview = outbound_mail_gateway.compose_preview(config, effective_policy, request)
              public_request = {
                  key: value
                  for key, value in preview["request"].items()
                  if key != "body"
              }
              artifact = {
                  "contract": "wwcx.outbound-mail-prepared.v1",
                  "status": "prepared_not_sent",
                  "network_activity": False,
                  "external_delivery_attempted": False,
                  "request": public_request,
                  "control_id": preview["control_id"],
                  "action_url": preview["action_url"],
                  "action_token_sha256": preview["action_token_sha256"],
                  "headers": preview["headers"],
                  "body": preview["body"],
                  "audit_record": preview["audit_record"],
              }
              audit_record = copy.deepcopy(preview["audit_record"])
              audit_record["source"] = "outbound_mail_prepare_cli"
              audit_record["delivery_status"] = "prepared_not_sent"
              return artifact, audit_record
          '''
          new_prepare = '''def prepare_artifact(
              config: dict[str, Any],
              policy: dict[str, Any],
              identities: dict[str, Any],
              request: dict[str, Any],
          ) -> tuple[dict[str, Any], dict[str, Any]]:
              preview = identity_aware_outbound_gateway.compose_preview(
                  config,
                  policy,
                  identities,
                  request,
              )
              public_request = {
                  key: value
                  for key, value in preview["request"].items()
                  if key != "body"
              }
              artifact = {
                  "contract": "wwcx.outbound-mail-prepared.v1",
                  "status": "prepared_not_sent",
                  "network_activity": False,
                  "external_delivery_attempted": False,
                  "request": public_request,
                  "sender_selection": preview["sender_selection"],
                  "control_id": preview["control_id"],
                  "action_url": preview["action_url"],
                  "action_token_sha256": preview["action_token_sha256"],
                  "headers": preview["headers"],
                  "body": preview["body"],
                  "audit_record": preview["audit_record"],
              }
              audit_record = copy.deepcopy(preview["audit_record"])
              audit_record["source"] = "outbound_mail_prepare_cli"
              audit_record["delivery_status"] = "prepared_not_sent"
              audit_record["sender_address"] = preview["sender_selection"]["address"]
              audit_record["sender_selection_reason"] = preview["sender_selection"]["reason"]
              audit_record["sender_identity_key"] = preview["sender_selection"]["identity_key"]
              return artifact, audit_record
          '''
          if cli_text.count(old_prepare) != 1:
              raise SystemExit('CLI prepare function anchor was not unique')
          cli_text = cli_text.replace(old_prepare, new_prepare, 1)

          old_main = '''        policy = outbound_mail_gateway.load_json(policy_path)
                  outbound_mail_policy.validate_policy(policy)
                  request = load_request(args.input)
                  artifact, audit_record = prepare_artifact(config, policy, request)
          '''
          new_main = '''        policy = outbound_mail_gateway.load_json(policy_path)
                  outbound_mail_policy.validate_policy(policy)
                  identities = outbound_mail_gateway.load_json(Path(args.identities).resolve())
                  mail_identity_registry.validate_registry(identities)
                  request = load_request(args.input)
                  artifact, audit_record = prepare_artifact(
                      config,
                      policy,
                      identities,
                      request,
                  )
          '''
          if cli_text.count(old_main) != 1:
              raise SystemExit('CLI main identity-loading anchor was not unique')
          cli_text = cli_text.replace(old_main, new_main, 1)
          cli_text = cli_text.replace(
              '    except (OSError, ValueError, KeyError, outbound_mail_gateway.GatewayError) as exc:\n',
              '    except (\n        OSError,\n        ValueError,\n        KeyError,\n        outbound_mail_gateway.GatewayError,\n        mail_identity_registry.IdentityRegistryError,\n    ) as exc:\n',
              1,
          )
          cli.write_text(cli_text, encoding='utf-8')

          policy_path = Path('config/messaging/outbound-mail-policy.json')
          policy = json.loads(policy_path.read_text(encoding='utf-8'))
          policy['delivery']['allowed_from_domains'] = [
              'ww.cx',
              'creekco.ca',
              'spiritcreekgardens.com',
              'scgardens.ca',
              'omegafx.com',
          ]
          policy_path.write_text(json.dumps(policy, indent=2) + '\n', encoding='utf-8')

          schema_path = Path('schemas/outbound-mail-prepare-request.schema.json')
          schema = json.loads(schema_path.read_text(encoding='utf-8'))
          schema['required'] = [item for item in schema['required'] if item != 'from_address']
          schema['properties']['from_address']['description'] = (
              'Optional submitted sender metadata. The canonical identity registry may replace it; '
              'it cannot override automatic sender selection.'
          )
          schema['properties']['identity_hint'] = {
              'type': 'string',
              'minLength': 1,
              'maxLength': 160,
              'description': 'Canonical sender-profile key or registered sender address.',
          }
          schema['properties']['original_recipient'] = {
              'type': 'string',
              'format': 'email',
              'description': 'Original managed address that received the correspondence being answered.',
          }
          schema['properties']['system_generated'] = {
              'type': 'boolean',
              'default': False,
              'description': 'Selects the reserved noreply identity; manual hints cannot select noreply.',
          }
          schema_path.write_text(json.dumps(schema, indent=2) + '\n', encoding='utf-8')

          example_path = Path('examples/outbound-mail/prepare-request.json')
          example = json.loads(example_path.read_text(encoding='utf-8'))
          example.pop('from_address', None)
          example['identity_hint'] = 'john-wwcx'
          ordered = {'identity_hint': example.pop('identity_hint'), **example}
          example_path.write_text(json.dumps(ordered, indent=2) + '\n', encoding='utf-8')

          identity_test = Path('tests/test_identity_aware_outbound_gateway.py')
          identity_text = identity_test.read_text(encoding='utf-8')
          identity_text = identity_text.replace(
              '        self.assertTrue(preview["sender_selection"]["from_address_replaced"])\n        self.assertNotIn("wrong@example.com", json.dumps(preview))\n',
              '        self.assertTrue(preview["sender_selection"]["from_address_replaced"])\n        self.assertEqual(preview["audit_record"]["from_address"], "john@spiritcreekgardens.com")\n        self.assertIn("Email: john@spiritcreekgardens.com", preview["body"])\n        self.assertNotIn("wrong@example.com", json.dumps(preview))\n',
              1,
          )
          identity_text = identity_text.replace(
              '        self.assertEqual(preview["request"]["reply_to"], "records@spiritcreekgardens.com")\n',
              '        self.assertEqual(preview["request"]["reply_to"], "records@spiritcreekgardens.com")\n        self.assertEqual(preview["audit_record"]["from_address"], "records@spiritcreekgardens.com")\n        self.assertIn("Email: records@spiritcreekgardens.com", preview["body"])\n',
              1,
          )
          identity_text = identity_text.replace(
              '        self.assertEqual(preview["sender_selection"]["reason"], "system_generated")\n',
              '        self.assertEqual(preview["sender_selection"]["reason"], "system_generated")\n        self.assertEqual(preview["audit_record"]["from_address"], "noreply@ww.cx")\n        self.assertIn("Email: noreply@ww.cx", preview["body"])\n',
              1,
          )
          identity_test.write_text(identity_text, encoding='utf-8')

          cli_test = Path('tests/validate_outbound_mail_prepare_cli.py')
          cli_test.write_text(r'''#!/usr/bin/env python3
          """Repository validation for the identity-aware no-send preparation CLI."""

          from __future__ import annotations

          import json
          import pathlib
          import subprocess
          import sys
          import tempfile


          ROOT = pathlib.Path(__file__).resolve().parents[1]
          CLI = ROOT / "tools" / "outbound_mail_prepare.py"


          def run_cli(arguments: list[str], payload: dict | None = None) -> subprocess.CompletedProcess[str]:
              return subprocess.run(
                  [sys.executable, str(CLI), *arguments],
                  cwd=ROOT,
                  input=None if payload is None else json.dumps(payload),
                  text=True,
                  capture_output=True,
                  check=False,
              )


          def sample_request() -> dict:
              return {
                  "from_address": "wrong@example.net",
                  "identity_hint": "creekco-contact",
                  "to": ["records@example.com", "manager@example.com"],
                  "cc": [],
                  "bcc": [],
                  "subject": "Controlled records request",
                  "body": "Hello,\n\nPlease provide the requested records.\n",
                  "message_class": "business_correspondence",
                  "signer_name": "John Kaminski",
                  "signer_title": "Authorized Representative",
                  "case_id": "TEST-MATTER-001",
                  "action_id": "TEST-ACTION-001",
                  "mailing_address": "151 2 Street South, Invermay, SK",
              }


          assert CLI.is_file(), CLI
          source = CLI.read_text(encoding="utf-8")
          for required in (
              "prepared_not_sent",
              "external_delivery_attempted",
              "identity_aware_outbound_gateway",
              "mail_identity_registry",
              "sender_selection",
              "action_token_sha256",
              "outbound_mail_prepare_cli",
          ):
              assert required in source, required
          assert "smtplib" not in source
          assert "requests." not in source
          assert "urllib.request" not in source

          example = run_cli(["--example"])
          assert example.returncode == 0, example.stderr
          example_payload = json.loads(example.stdout)
          assert example_payload["identity_hint"] == "john-wwcx"
          assert "from_address" not in example_payload
          assert example_payload["message_class"] == "business_correspondence"

          with tempfile.TemporaryDirectory() as temporary_directory:
              temporary = pathlib.Path(temporary_directory)
              output_path = temporary / "prepared.json"
              body_path = temporary / "prepared.txt"
              audit_path = temporary / "audit.jsonl"

              result = run_cli(
                  [
                      "--pretty",
                      "--output",
                      str(output_path),
                      "--body-output",
                      str(body_path),
                      "--audit-jsonl",
                      str(audit_path),
                  ],
                  sample_request(),
              )
              assert result.returncode == 0, result.stderr
              assert result.stdout == ""

              artifact = json.loads(output_path.read_text(encoding="utf-8"))
              body = body_path.read_text(encoding="utf-8")
              audit_lines = audit_path.read_text(encoding="utf-8").splitlines()
              assert len(audit_lines) == 1
              audit = json.loads(audit_lines[0])

              assert artifact["contract"] == "wwcx.outbound-mail-prepared.v1"
              assert artifact["status"] == "prepared_not_sent"
              assert artifact["network_activity"] is False
              assert artifact["external_delivery_attempted"] is False
              assert artifact["request"]["from_address"] == "contact@creekco.ca"
              assert artifact["request"]["reply_to"] == "contact@creekco.ca"
              assert artifact["sender_selection"]["address"] == "contact@creekco.ca"
              assert artifact["sender_selection"]["reason"] == "identity_hint"
              assert artifact["sender_selection"]["from_address_replaced"] is True
              assert artifact["audit_record"]["from_address"] == "contact@creekco.ca"
              assert artifact["headers"]["X-WWCX-Tracking"] == "disclosed-action-link; no-hidden-pixel"
              assert artifact["headers"]["X-WWCX-Case-ID"] == "TEST-MATTER-001"
              assert artifact["headers"]["X-WWCX-Action-ID"] == "TEST-ACTION-001"
              assert len(artifact["action_token_sha256"]) == 64
              assert "action_token" not in artifact
              assert "contact@creekco.ca" in body
              assert "wrong@example.net" not in json.dumps(artifact, sort_keys=True)
              assert "151 2 Street South, Invermay, SK" in body
              assert "Access to the linked correspondence record may be logged" in body
              assert "does not create confidentiality, privilege" in body
              assert body == artifact["body"]

              raw_token = artifact["action_url"].rsplit("/", 1)[-1]
              audit_serialized = json.dumps(audit, sort_keys=True)
              assert raw_token not in audit_serialized
              assert sample_request()["body"] not in audit_serialized
              assert "wrong@example.net" not in audit_serialized
              assert audit["source"] == "outbound_mail_prepare_cli"
              assert audit["delivery_status"] == "prepared_not_sent"
              assert audit["sender_address"] == "contact@creekco.ca"
              assert audit["sender_selection_reason"] == "identity_hint"

          spirit = sample_request()
          spirit.pop("identity_hint")
          spirit["original_recipient"] = "john@spiritcreekgardens.com"
          spirit_result = run_cli(["--pretty"], spirit)
          assert spirit_result.returncode == 0, spirit_result.stderr
          spirit_artifact = json.loads(spirit_result.stdout)
          assert spirit_artifact["request"]["from_address"] == "john@spiritcreekgardens.com"
          assert spirit_artifact["audit_record"]["from_address"] == "john@spiritcreekgardens.com"
          assert "Email: john@spiritcreekgardens.com" in spirit_artifact["body"]

          system = sample_request()
          system.pop("identity_hint")
          system["system_generated"] = True
          system_result = run_cli(["--pretty"], system)
          assert system_result.returncode == 0, system_result.stderr
          system_artifact = json.loads(system_result.stdout)
          assert system_artifact["request"]["from_address"] == "noreply@ww.cx"
          assert system_artifact["request"]["reply_to"] is None
          assert system_artifact["sender_selection"]["reason"] == "system_generated"
          assert "Email: noreply@ww.cx" in system_artifact["body"]

          invalid_hint = sample_request()
          invalid_hint["identity_hint"] = "unknown-profile"
          invalid_hint_result = run_cli([], invalid_hint)
          assert invalid_hint_result.returncode == 2
          assert "identity_hint is invalid" in invalid_hint_result.stderr

          unknown_recipient = sample_request()
          unknown_recipient.pop("identity_hint")
          unknown_recipient["original_recipient"] = "unknown@ww.cx"
          unknown_recipient_result = run_cli([], unknown_recipient)
          assert unknown_recipient_result.returncode == 2
          assert "original recipient is not a registered mail identity" in unknown_recipient_result.stderr

          commercial = sample_request()
          commercial["message_class"] = "commercial"
          commercial_result = run_cli([], commercial)
          assert commercial_result.returncode == 2
          assert "unsubscribe_url" in commercial_result.stderr

          print("Identity-aware outbound mail preparation CLI validation passed")
          print("Canonical sender selection is active; live delivery remains unavailable")
          ''', encoding='utf-8')

          docs_path = Path('docs/messaging-operations/outbound-mail-prepare-cli-20260801.md')
          docs = docs_path.read_text(encoding='utf-8')
          marker = '## Canonical sender selection'
          if marker not in docs:
              docs += '''

          ## Canonical sender selection

          The preparation adapter now loads `config/messaging/mail-identities.json` and uses the same automatic sender-selection rules as the gateway service. A request can provide:

          - `original_recipient` when replying to mail received at a managed identity;
          - `identity_hint` as a canonical sender-profile key or registered sender address;
          - `system_generated: true` for the reserved `noreply@ww.cx` identity.

          A submitted `from_address` is treated as metadata only and cannot override the registry. The prepared request, footer, audit record, and eventual email envelope use the resolved sender consistently. The result includes `sender_selection` with the selected address, reason, identity key, replacement status, and live-delivery status.

          All sender profiles and the global outbound activation flag remain disabled in the committed configuration. This feature chooses a preparation identity; it does not authorize or attempt delivery.
          '''
              docs_path.write_text(docs, encoding='utf-8')
          PY

      - name: Validate identity-aware preparation
        run: |
          python3 -m json.tool config/messaging/outbound-mail-policy.json >/dev/null
          python3 -m json.tool config/messaging/mail-identities.json >/dev/null
          python3 -m json.tool schemas/outbound-mail-prepare-request.schema.json >/dev/null
          python3 -m json.tool examples/outbound-mail/prepare-request.json >/dev/null
          python3 -m unittest \
            tests.test_outbound_mail_policy \
            tests.test_outbound_mail_gateway \
            tests.test_mail_identity_registry \
            tests.test_identity_aware_outbound_gateway
          python3 tests/validate_outbound_mail_prepare_cli.py
          python3 tests/validate_outbound_mail_gateway.py
          python3 -m compileall -q server tools tests

      - name: Commit final changes and remove one-shot workflow
        run: |
          rm .github/workflows/apply-identity-aware-prepare-cli.yml
          git config user.name "WW.CX Engineering Agent"
          git config user.email "johnkaminski727@gmail.com"
          git add -A
          git commit -m "Make outbound preparation identity aware"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
