name: Digital Archive backup restore acceptance

on:
  pull_request:
    paths:
      - 'deploy/digital-archive/backup_restore_acceptance.py'
      - 'deploy/digital-archive/paperless/compose.yaml'
      - 'deploy/digital-archive/archivebox/compose.yaml'
      - 'docs/archive/backup-restore-acceptance.md'
      - 'tests/test_digital_archive_backup_restore_acceptance.py'
      - '.github/workflows/digital-archive-backup-restore-acceptance.yml'
  push:
    branches: [main]
    paths:
      - 'deploy/digital-archive/backup_restore_acceptance.py'
      - 'deploy/digital-archive/paperless/compose.yaml'
      - 'deploy/digital-archive/archivebox/compose.yaml'
      - 'docs/archive/backup-restore-acceptance.md'
      - 'tests/test_digital_archive_backup_restore_acceptance.py'
      - '.github/workflows/digital-archive-backup-restore-acceptance.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Compile restore acceptance
        run: python3 -m py_compile deploy/digital-archive/backup_restore_acceptance.py tests/test_digital_archive_backup_restore_acceptance.py
      - name: Run restore boundary tests
        run: python3 -m unittest -v tests.test_digital_archive_backup_restore_acceptance tests.test_digital_archive_private_foundation tests.test_digital_archive_foundation
      - name: Guard backup and public boundaries
        run: |
          ! grep -nEi '(certbot|a2ensite|a2enmod|iptables|nft add|ufw |/var/www/edge1-status|rm -rf|shutil\.rmtree|docker compose down -v)' deploy/digital-archive/backup_restore_acceptance.py
          grep -F "'off_host_backup_created': False" deploy/digital-archive/backup_restore_acceptance.py
          grep -F "'production_projects_changed': False" deploy/digital-archive/backup_restore_acceptance.py
          grep -F "'ephemeral_secret_values_recorded': False" deploy/digital-archive/backup_restore_acceptance.py
          grep -F "'public_changes': False" deploy/digital-archive/backup_restore_acceptance.py
      - name: Reject obvious secret material
        run: |
          ! grep -RniE '(BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|AKIA[0-9A-Z]{16}|gh[pousr]_[A-Za-z0-9_]{20,}|password[[:space:]]*=[[:space:]]*[^$])' \
            deploy/digital-archive/backup_restore_acceptance.py \
            docs/archive/backup-restore-acceptance.md \
            tests/test_digital_archive_backup_restore_acceptance.py
